name: Desktop

# Packaging, on a tag or a manual run only (ADR 0043, ADR 0046): build every
# package, install each one in its own job, and smoke the installed
# application against the exact web/dist that went into it. Each bundle job
# also builds this source as version 0.0.1: build A of the upgrade jobs, which
# install A, fill it, replace it with this build the way the format updates,
# and check that nothing was lost. The desktop crate and the unpackaged smoke
# run with every pull request in ci.yml. `desktop-packaging` passes only if
# all six formats and all five upgrades passed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Docker Hub's official images, from ECR Public's copy of them: Docker Hub
  # limits anonymous pulls per address, and runners share addresses.
  REGISTRY: public.ecr.aws/docker/library

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-linux:
    name: Bundle deb, rpm, AppImage (in Ubuntu 22.04)
    # The oldest supported system, so the packages need nothing newer than
    # glibc 2.35; desktop_bundle.py refuses a binary that does. A container,
    # not a runner image, so the floor does not move when GitHub retires one
    # (ADR 0064).
    runs-on: ubuntu-24.04
    # REGISTRY's ubuntu:22.04; a job's container cannot read env.
    container: public.ecr.aws/docker/library/ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      # A container has no FUSE; the AppImage tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # What a runner image brings, then what the bundler needs.
      - name: System libraries and bundler tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config file \
            python3 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/checkout@v4
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The version and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-linux
      # A prebuilt cargo-tauri through cargo-binstall; building it took 11-19 minutes.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - run: python3 scripts/desktop_bundle.py deb rpm appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: spa-linux
          if-no-files-found: error
          path: web/dist
      # Build A is this source at an older version: a different build that
      # identifies itself differently, which is what an upgrade replaces.
      - name: Build A (version 0.0.1)
        run: |
          rm -rf target/release/bundle
          python3 scripts/at_version.py 0.0.1 -- python3 scripts/desktop_bundle.py deb rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-a
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
      # The upgrades create their data directory with the standalone CLI.
      - run: cargo build --release --locked -p uguisu-cli
      - uses: actions/upload-artifact@v4
        with:
          name: uguisu-cli-linux
          if-no-files-found: error
          path: target/release/uguisu

  bundle-windows:
    name: Bundle NSIS and MSI
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The version and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-windows
      # A prebuilt cargo-tauri through cargo-binstall; building it took 11-19 minutes.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      # The bundler downloads and hash-checks WiX and NSIS itself.
      - run: python scripts/desktop_bundle.py nsis msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
      # Its own build of the UI: a Windows checkout's line endings could give
      # different bytes, and the comparison is against what was bundled here.
      - uses: actions/upload-artifact@v4
        with:
          name: spa-windows
          if-no-files-found: error
          path: web/dist
      - name: Build A (version 0.0.1)
        run: |
          Remove-Item -Recurse -Force target/release/bundle
          python scripts/at_version.py 0.0.1 -- python scripts/desktop_bundle.py nsis msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages-a
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
      - run: cargo build --release --locked -p uguisu-cli
      - uses: actions/upload-artifact@v4
        with:
          name: uguisu-cli-windows
          if-no-files-found: error
          path: target/release/uguisu.exe

  bundle-flatpak:
    name: Bundle the Flatpak (GNOME 50)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The version and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - name: Vendor the crates the manifest builds from
        run: cargo vendor --locked --versioned-dirs ../flatpak-vendor > /dev/null
        working-directory: desktop
      - name: flatpak-builder and the GNOME 50 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 confines unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # Build A first, so B is the later commit of the same ref, as a release
      # is: flatpak refuses an update to an older commit. Its bundle goes
      # outside the checkout, which B's build copies.
      - name: Build A (version 0.0.1)
        run: |
          set -euo pipefail
          python3 scripts/at_version.py 0.0.1 -- flatpak-builder --user --install-deps-from=flathub \
            --disable-rofiles-fuse --force-clean --repo=flatpak-repo flatpak-build \
            desktop/flatpak/io.github.suzora.Uguisu.yml
          flatpak build-bundle flatpak-repo "$RUNNER_TEMP/uguisu-a.flatpak" io.github.suzora.Uguisu \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-package-a
          if-no-files-found: error
          path: ${{ runner.temp }}/uguisu-a.flatpak
      - name: Build offline from declared sources
        run: >-
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse
          --force-clean --repo=flatpak-repo flatpak-build
          desktop/flatpak/io.github.suzora.Uguisu.yml
      - run: >-
          flatpak build-bundle flatpak-repo uguisu.flatpak io.github.suzora.Uguisu
          --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          if-no-files-found: error
          path: uguisu.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: spa-flatpak
          if-no-files-found: error
          path: web/dist

  upgrade-deb:
    name: Upgrade a .deb in place with apt and keep the data (Ubuntu 22.04)
    needs: bundle-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-a
          path: before
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: uguisu-cli-linux
          path: cli
      - name: Install A, populate, upgrade to B with apt, reopen
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(ls before/deb/*.deb | wc -l)" -eq 1
          test "$(ls pkgs/deb/*.deb | wc -l)" -eq 1
          chmod +x cli/uguisu
          after=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          docker run --rm --init -e DEBIAN_FRONTEND=noninteractive -e AFTER="$after" -v "$PWD:/w:ro" "$REGISTRY/ubuntu:22.04" bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq /w/before/deb/*.deb python3 xvfb xauth
            cd /
            xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 PYTHONDONTWRITEBYTECODE=1 \
              python3 /w/scripts/desktop_upgrade.py --cli /w/cli/uguisu --layout deb \
                --before /usr/bin/uguisu-desktop --before-version 0.0.1 \
                --replace "apt-get install -y -qq /w/pkgs/deb/*.deb" \
                --after /usr/bin/uguisu-desktop --after-version "$AFTER"'

  upgrade-rpm:
    name: Upgrade an .rpm with dnf and keep the data (Fedora 43)
    needs: bundle-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-a
          path: before
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: uguisu-cli-linux
          path: cli
      - name: Install A, populate, upgrade to B with dnf, reopen
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(ls before/rpm/*.rpm | wc -l)" -eq 1
          test "$(ls pkgs/rpm/*.rpm | wc -l)" -eq 1
          chmod +x cli/uguisu
          after=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          docker run --rm --init -e AFTER="$after" -v "$PWD:/w:ro" "$REGISTRY/fedora:43" bash -euo pipefail -c '
            dnf install -y -q /w/before/rpm/*.rpm python3 xorg-x11-server-Xvfb xorg-x11-xauth
            cd /
            xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 PYTHONDONTWRITEBYTECODE=1 \
              python3 /w/scripts/desktop_upgrade.py --cli /w/cli/uguisu --layout rpm \
                --before /usr/bin/uguisu-desktop --before-version 0.0.1 \
                --replace "dnf upgrade -y -q /w/pkgs/rpm/*.rpm" \
                --after /usr/bin/uguisu-desktop --after-version "$AFTER"'

  package-deb:
    name: Install and smoke the .deb (Ubuntu 22.04, Ubuntu 24.04, Debian 12)
    needs: bundle-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: spa-linux
          path: spa
      - name: Install into each clean container and smoke it
        timeout-minutes: 30
        run: |
          set -euo pipefail
          test "$(ls pkgs/deb/*.deb | wc -l)" -eq 1
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "::group::$image"
            docker run --rm --init -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/w:ro" "$REGISTRY/$image" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq /w/pkgs/deb/*.deb python3 xvfb xauth
              dpkg -L uguisu | grep -qx /usr/lib/Uguisu/web/index.html
              cd /
              xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
                LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 PYTHONDONTWRITEBYTECODE=1 \
                python3 /w/scripts/desktop_smoke.py --expect-spa /w/spa --layout deb \
                  --installed-binary /usr/bin/uguisu-desktop -- /usr/bin/uguisu-desktop'
            echo "::endgroup::"
          done

  package-rpm:
    name: Install and smoke the .rpm (Fedora 43)
    needs: bundle-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: spa-linux
          path: spa
      - name: Install into a clean container and smoke it
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(ls pkgs/rpm/*.rpm | wc -l)" -eq 1
          docker run --rm --init -v "$PWD:/w:ro" "$REGISTRY/fedora:43" bash -euo pipefail -c '
            dnf install -y -q /w/pkgs/rpm/*.rpm python3 xorg-x11-server-Xvfb xorg-x11-xauth
            rpm -qlp /w/pkgs/rpm/*.rpm | grep -qx /usr/lib/Uguisu/web/index.html
            cd /
            xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 PYTHONDONTWRITEBYTECODE=1 \
              python3 /w/scripts/desktop_smoke.py --expect-spa /w/spa --layout rpm \
                --installed-binary /usr/bin/uguisu-desktop -- /usr/bin/uguisu-desktop'

  package-appimage:
    name: Extract and smoke the AppImage (Ubuntu 22.04, Debian 12, and FUSE on the runner)
    needs: bundle-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: spa-linux
          path: spa
      - name: Extract into clean containers with no WebKitGTK, and run its AppRun
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(ls pkgs/appimage/*.AppImage | wc -l)" -eq 1
          chmod +x pkgs/appimage/*.AppImage
          for image in ubuntu:22.04 debian:12; do
            echo "::group::$image"
            docker run --rm --init -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/w:ro" "$REGISTRY/$image" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq python3 xvfb xauth libgl1 libegl1 libgbm1 libfontconfig1 libharfbuzz0b libfribidi0 ca-certificates
              cd /tmp && /w/pkgs/appimage/*.AppImage --appimage-extract > /dev/null
              test -f /tmp/squashfs-root/usr/lib/Uguisu/web/index.html
              cd /
              xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
                LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 PYTHONDONTWRITEBYTECODE=1 \
                python3 /w/scripts/desktop_smoke.py --expect-spa /w/spa --layout appimage \
                  --installed-binary /tmp/squashfs-root/usr/bin/uguisu-desktop -- /tmp/squashfs-root/AppRun'
            echo "::endgroup::"
          done
      - name: Run the AppImage itself through FUSE, as a user would
        timeout-minutes: 10
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb xauth libgl1 libegl1 libgbm1 libfontconfig1 libharfbuzz0b libfribidi0 ca-certificates
          cd /
          xvfb-run -a python3 "$GITHUB_WORKSPACE/scripts/desktop_smoke.py" \
            --expect-spa "$GITHUB_WORKSPACE/spa" --layout appimage \
            -- "$(ls "$GITHUB_WORKSPACE"/pkgs/appimage/*.AppImage)"

  package-flatpak:
    name: Install and smoke the Flatpak
    needs: bundle-flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-package
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: spa-flatpak
          path: spa
      - name: Install the bundle and its runtime
        run: |
          set -euo pipefail
          test "$(ls pkgs/*.flatpak | wc -l)" -eq 1
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive pkgs/*.flatpak
          flatpak run --command=test io.github.suzora.Uguisu -f /app/lib/Uguisu/web/index.html
      - name: Smoke the installed application
        timeout-minutes: 10
        run: |
          set -euo pipefail
          files="$(flatpak info --user --show-location io.github.suzora.Uguisu)/files"
          cd /
          xvfb-run -a python3 "$GITHUB_WORKSPACE/scripts/desktop_smoke.py" \
            --expect-spa "$GITHUB_WORKSPACE/spa" --layout flatpak --default-data-dir \
            --installed-binary "$files/bin/uguisu-desktop" \
            -- flatpak run --env=WEBKIT_DISABLE_DMABUF_RENDERER=1 --env=WEBKIT_DISABLE_COMPOSITING_MODE=1 \
               --env=LIBGL_ALWAYS_SOFTWARE=1 --env=NO_AT_BRIDGE=1 io.github.suzora.Uguisu

  package-nsis:
    name: Install and smoke the NSIS installer
    needs: bundle-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: spa-windows
          path: spa
      - name: Install, smoke, uninstall, and keep the data
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem pkgs -Recurse -Filter *-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one NSIS installer, found $($setup.Count)" }
          $dir = 'C:\av-nsis'
          $p = Start-Process $setup[0].FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\web\index.html")) { throw "no web\index.html beside the installed executable" }
          $main = @(Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' })
          if ($main.Count -ne 1) { throw "expected one application executable, found $($main.Name)" }
          Push-Location $env:RUNNER_TEMP
          $out = python "$env:GITHUB_WORKSPACE\scripts\desktop_smoke.py" --expect-spa "$env:GITHUB_WORKSPACE\spa" `
            --layout nsis --default-data-dir --installed-binary $main[0].FullName -- $main[0].FullName
          $code = $LASTEXITCODE
          Pop-Location
          $out
          if ($code -ne 0) { throw "the smoke test failed" }
          $data = ($out | Select-String '^data_dir=(.*)$').Matches[0].Groups[1].Value
          # A login item for the uninstaller to remove: the Run value the app writes, named after the product.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $item = (Get-Content desktop\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).productName
          New-ItemProperty $run -Name $item -Value "`"$($main[0].FullName)`" " -Force | Out-Null
          & "$dir\uninstall.exe" /S
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $main[0].FullName) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path $main[0].FullName) { throw "the uninstaller did not remove the application" }
          # It removes the Run value after the executable.
          while ((Get-ItemProperty $run -Name $item -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if ($null -ne (Get-ItemProperty $run -Name $item -ErrorAction SilentlyContinue)) { throw "the uninstaller left the login item $item" }
          if (-not (Test-Path "$data\uguisu.db")) { throw "uninstalling removed $data\uguisu.db" }
          "data kept at $data"

  package-msi:
    name: Install and smoke the MSI
    needs: bundle-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: spa-windows
          path: spa
      - name: Install, smoke, uninstall, and keep the data
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem pkgs -Recurse -Filter *.msi)
          if ($msi.Count -ne 1) { throw "expected one MSI, found $($msi.Count)" }
          $dir = 'C:\av-msi'
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi[0].FullName)`" /qn INSTALLDIR=$dir /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "msiexec exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\web\index.html")) { throw "no web\index.html beside the installed executable" }
          $main = @(Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' })
          if ($main.Count -ne 1) { throw "expected one application executable, found $($main.Name)" }
          Push-Location $env:RUNNER_TEMP
          # Ended by a logoff rather than its window, which the NSIS smoke closes.
          $out = python "$env:GITHUB_WORKSPACE\scripts\desktop_smoke.py" --expect-spa "$env:GITHUB_WORKSPACE\spa" `
            --layout msi --close logoff --default-data-dir --installed-binary $main[0].FullName -- $main[0].FullName
          $code = $LASTEXITCODE
          Pop-Location
          $out
          if ($code -ne 0) { throw "the smoke test failed" }
          $data = ($out | Select-String '^data_dir=(.*)$').Matches[0].Groups[1].Value
          # A login item for the uninstaller to remove: the Run value the app writes, named after the product.
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $item = (Get-Content desktop\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).productName
          New-ItemProperty $run -Name $item -Value "`"$($main[0].FullName)`" " -Force | Out-Null
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi[0].FullName)`" /qn /l*v `"$env:RUNNER_TEMP\uninstall.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          if (Test-Path $main[0].FullName) { throw "uninstalling did not remove the application" }
          if ($null -ne (Get-ItemProperty $run -Name $item -ErrorAction SilentlyContinue)) { throw "uninstalling left the login item $item" }
          if (-not (Test-Path "$data\uguisu.db")) { throw "uninstalling removed $data\uguisu.db" }
          "data kept at $data"

  upgrade-flatpak:
    name: Update the Flatpak by installing the newer bundle and keep the data
    needs: [bundle-flatpak, bundle-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-package-a
          path: before
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-package
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: uguisu-cli-linux
          path: cli
      - name: Install A's bundle
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb xauth
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive before/uguisu-a.flatpak
      # The update INSTALL.md tells a user to make: install the newer bundle.
      - name: Populate A, install B's bundle over it, reopen
        timeout-minutes: 20
        run: |
          set -euo pipefail
          chmod +x cli/uguisu
          after=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          app="flatpak run --env=WEBKIT_DISABLE_DMABUF_RENDERER=1 --env=WEBKIT_DISABLE_COMPOSITING_MODE=1"
          app="$app --env=LIBGL_ALWAYS_SOFTWARE=1 --env=NO_AT_BRIDGE=1 io.github.suzora.Uguisu"
          cd /
          # The data directory inside the app's own, which the sandbox sees at the same path.
          xvfb-run -a python3 "$GITHUB_WORKSPACE/scripts/desktop_upgrade.py" --cli "$GITHUB_WORKSPACE/cli/uguisu" \
            --layout flatpak --data-dir "$HOME/.var/app/io.github.suzora.Uguisu/upgrade-data" \
            --before "$app" --before-version 0.0.1 \
            --replace "flatpak install --user -y --noninteractive $GITHUB_WORKSPACE/pkgs/uguisu.flatpak" \
            --after "$app" --after-version "$after"

  upgrade-nsis:
    name: Install the NSIS installer over an older one, keeping the data and the login item
    needs: bundle-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages-a
          path: before
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: uguisu-cli-windows
          path: cli
      - name: Install A, populate, install B over it, reopen
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $a = @(Get-ChildItem before -Recurse -Filter *-setup.exe)
          $b = @(Get-ChildItem pkgs -Recurse -Filter *-setup.exe)
          if ($a.Count -ne 1 -or $b.Count -ne 1) { throw "expected one installer each, found $($a.Count) and $($b.Count)" }
          # The default per-user folder, where a user who clicks through installs it.
          $p = Start-Process $a[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing A exited with $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Uguisu"
          $main = @(Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' })
          if ($main.Count -ne 1) { throw "expected one application executable in $dir, found $($main.Name)" }
          $exe = $main[0].FullName
          $after = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Push-Location $env:RUNNER_TEMP
          # As a user clicking through B's installer: its reinstall page runs
          # A's uninstaller, in place (_?=), which removes the Run value, and
          # then installs. `/S` alone skips that page and keeps the value.
          python "$env:GITHUB_WORKSPACE\scripts\desktop_upgrade.py" --cli "$env:GITHUB_WORKSPACE\cli\uguisu.exe" `
            --layout nsis --login-item removed --before "`"$exe`"" --before-version 0.0.1 `
            --replace "`"$dir\uninstall.exe`" /S _?=$dir && start `"`" /wait `"$($b[0].FullName)`" /S" `
            --after "`"$exe`"" --after-version $after
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "the upgrade failed" }

  upgrade-msi:
    name: Upgrade the MSI in Program Files, keeping the data and the login item, and refuse a downgrade
    needs: bundle-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages-a
          path: before
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: pkgs
      - uses: actions/download-artifact@v4
        with:
          name: uguisu-cli-windows
          path: cli
      - name: Install A, populate, upgrade to B, reopen, try A again
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $a = @(Get-ChildItem before -Recurse -Filter *.msi)
          $b = @(Get-ChildItem pkgs -Recurse -Filter *.msi)
          if ($a.Count -ne 1 -or $b.Count -ne 1) { throw "expected one MSI each, found $($a.Count) and $($b.Count)" }
          # The default folder, whose name has a space in it.
          $p = Start-Process msiexec -ArgumentList "/i `"$($a[0].FullName)`" /qn /l*v `"$env:RUNNER_TEMP\a.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\a.log" -Tail 60; throw "installing A exited with $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Uguisu"
          $main = @(Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' })
          if ($main.Count -ne 1) { throw "expected one application executable in $dir, found $($main.Name)" }
          $exe = $main[0].FullName
          $after = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Push-Location $env:RUNNER_TEMP
          python "$env:GITHUB_WORKSPACE\scripts\desktop_upgrade.py" --cli "$env:GITHUB_WORKSPACE\cli\uguisu.exe" `
            --layout msi --login-item kept --before "`"$exe`"" --before-version 0.0.1 `
            --replace "start `"`" /wait msiexec /i `"$($b[0].FullName)`" /qn /l*v `"$env:RUNNER_TEMP\b.log`"" `
            --after "`"$exe`"" --after-version $after
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\b.log" -Tail 60 -ErrorAction SilentlyContinue; throw "the upgrade failed" }
          $p = Start-Process msiexec -ArgumentList "/i `"$($a[0].FullName)`" /qn /l*v `"$env:RUNNER_TEMP\down.log`"" -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "installing A over B was not refused" }
          if (-not (Test-Path $exe)) { throw "the refused downgrade removed $exe" }
          "a downgrade was refused with $($p.ExitCode)"

  desktop-packaging:
    name: Desktop packaging (all six formats and the five upgrades)
    needs: [package-deb, package-rpm, package-appimage, package-flatpak, package-nsis, package-msi, upgrade-deb, upgrade-rpm, upgrade-flatpak, upgrade-nsis, upgrade-msi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_needs.py "$NEEDS"
