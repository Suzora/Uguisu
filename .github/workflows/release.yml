name: Release

# Pushing a tag like v0.2.0 publishes the container image to ghcr.io and creates a GitHub
# release. Starting the workflow by hand is a dry run: the image is built, nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      # Both images are compiled on this machine; the ARM one by cross-compiling (see the
      # Dockerfile). The emulator is only there to start the finished ARM image once.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build the ARM image for a test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: uguisu:arm-test
          provenance: false
      - name: The ARM image must start and answer its health check
        run: |
          docker run --rm --platform linux/arm64 uguisu:arm-test --version
          docker run -d --name uguisu-arm --platform linux/arm64 uguisu:arm-test
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' uguisu-arm)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs uguisu-arm
          echo "the ARM container did not become healthy (last status: $status)"
          exit 1
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attached to the image in the registry: a signed-by-nobody but complete record of
          # how it was built (commit, workflow, build steps), and a list of what is inside.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
