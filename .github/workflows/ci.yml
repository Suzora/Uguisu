name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Once a week even without changes: new advisories concern code that is already merged.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Known vulnerabilities, unmaintained crates, licenses and sources of all dependencies.
  # Configuration: deny.toml
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Spelling in code and documentation. Configuration: _typos.toml
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  # The container image is the main way to run Uguisu: build it and see it come up healthy.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uguisu:ci .
      - name: Start the container and wait for its health check
        run: |
          docker run -d --name uguisu uguisu:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' uguisu)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs uguisu
          echo "container did not become healthy (last status: $status)"
          exit 1
