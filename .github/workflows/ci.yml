name: CI

# Every job starts at once, and `ci` is the one check a pull request needs
# before it merges. How long each job may take, and how long they took, is
# ADR 0063. Every check's command lives in scripts/check.py, so CI
# and a developer run the same thing; --stream keeps the full output in the
# Actions log, and --require-tools turns a missing tool into a failure rather
# than a skip.
#
# Windows runs a reduced set on a pull request: clippy (the only lint of the
# cfg(windows) code), the CLI smoke, the binaries with cfg(windows) tests, and
# the desktop shell. `win-test-full` runs the whole suite on Windows after the
# merge. Packaging lives in desktop.yml and runs on tags and by hand.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # GitHub evicts a cache nobody read for seven days; main's must survive a
  # quiet week, or the next pull request starts cold.
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debug info: linking is faster (Windows writes no PDBs) and the caches
  # smaller. A panic still names its file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Rust caches are saved only from branch runs (main, the schedule, a manual
# run). A pull request restores main's and saves none, so it never evicts them.
jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration guard compares against main's history.
          fetch-depth: 0
      # The version and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: python3 scripts/check.py --stream --require-tools fmt docs migrations version docker desktop-meta deny web api-types

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - run: python3 scripts/check.py --stream --require-tools clippy

  test-engine:
    name: Tests (engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: python3 scripts/check.py --stream --require-tools test-engine

  test-rest:
    name: Tests (everything but the engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: python3 scripts/check.py --stream --require-tools test-rest

  e2e:
    name: Smoke and end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: python3 scripts/check.py --stream --require-tools smoke e2e

  desktop-lint:
    name: Desktop lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the desktop crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      # desktop/ is its own workspace and builds into the root target/.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The shell embeds web/dist when it compiles, so clippy needs it too.
      - run: python3 scripts/check.py --stream --require-tools web-build desktop-lint

  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the desktop crate
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: python3 scripts/check.py --stream --require-tools web-build desktop-test
      - run: cargo build --locked
        working-directory: desktop
      - name: Smoke the unpackaged desktop binary (not packaging evidence)
        timeout-minutes: 5
        # Xvfb workarounds belong to this step only, never to the app.
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: >-
          xvfb-run -a python3 scripts/desktop_smoke.py --expect-spa web/dist --layout unpackaged
          -- "$PWD/target/debug/uguisu-desktop"

  win-clippy:
    name: Windows clippy
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      # The only lint of the cfg(windows) code.
      - run: python scripts/check.py --stream --require-tools clippy

  win-cli:
    name: Windows CLI smoke
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - run: python scripts/check.py --stream --require-tools smoke

  win-tests:
    name: Windows tests (cfg(windows))
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: python scripts/check.py --stream --require-tools test-windows

  win-desktop-lint:
    name: Windows desktop lint
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: python scripts/check.py --stream --require-tools web-build desktop-lint

  win-desktop:
    name: Windows desktop
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../target
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: python scripts/check.py --stream --require-tools web-build desktop-test
      - run: cargo build --locked
        working-directory: desktop
      - name: Smoke the unpackaged desktop binary (not packaging evidence)
        timeout-minutes: 5
        run: python scripts/desktop_smoke.py --expect-spa web/dist --layout unpackaged -- "$env:GITHUB_WORKSPACE\target\debug\uguisu-desktop.exe"

  win-test-full:
    name: Windows tests (all)
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ startsWith(github.ref, 'refs/heads/') }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: python scripts/check.py --stream --require-tools test

  ci:
    name: ci
    needs: [quick, clippy, test-engine, test-rest, e2e, desktop-lint, desktop, win-clippy, win-cli, win-tests, win-desktop-lint, win-desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_needs.py --ci "$NEEDS"
