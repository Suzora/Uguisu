[package]
name = "uguisu-download"
description = "Persistent, resumable, rate-limited download job system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# Scenario media server and failure injection for tests of dependent crates.
testing = ["dep:axum", "dep:bytes"]

[dependencies]
utoipa = { workspace = true }
uguisu-core = { workspace = true }
uguisu-http = { workspace = true }
uguisu-storage = { workspace = true }
axum = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
fs4 = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
uguisu-download = { path = ".", features = ["testing"] }
criterion = { workspace = true }
uguisu-storage = { workspace = true, features = ["testing"] }
sqlx = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[[bench]]
name = "downloads"
harness = false
