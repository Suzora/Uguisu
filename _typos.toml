# typos: spell checker for code and documentation, run in CI.
# Run locally with `typos`.

[files]
extend-exclude = [
    "Cargo.lock",
    "LICENSE",
    "crates/uguisu/assets/htmx.min.js",
    # The German texts of the interface; the checker knows English only.
    "crates/uguisu/src/i18n.rs",
]

[default]
# Password hashes in tests are random letters, not words.
extend-ignore-re = ['\$argon2id\$[A-Za-z0-9$=,+/]+']
