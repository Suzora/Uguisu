# cargo-deny for the desktop workspace.
#
# Two deliberate differences from the root policy, both measured rather than
# assumed (ADR 0043):
#
#   targets       the root policy resolves every target, which drags in Tauri's
#                 Android-only `reqwest` path and trips the `reqwest` ban. The
#                 two targets Uguisu actually ships are clean.
#   all-features  likewise: `tauri`'s `native-tls` feature is never enabled by
#                 this crate, and resolving it would ban a crate nothing builds.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Six `unmaintained` advisories, no vulnerabilities. Every one of them is
# reached only through the Tauri/GTK stack, which this crate does not choose
# and cannot substitute, and each was traced to its parent before being listed
# here. Re-check when Tauri moves off gtk-rs 0.18 or `urlpattern` 0.3.
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste, via lofty -> uguisu-metadata. The same crate and the same reason the root policy records; it is a build-time proc macro."

[[advisories.ignore]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error, via glib-macros -> glib -> gtk -> muda/tao/wry -> tauri. A build-time proc macro on the Linux GTK path only; nothing of it ships."

[[advisories.ignore]]
id = "RUSTSEC-2025-0075"
reason = "unic-char-range, via urlpattern -> tauri-utils. urlpattern is what matches a capability's remote URL, so it is load-bearing and not removable here."

[[advisories.ignore]]
id = "RUSTSEC-2025-0080"
reason = "unic-common, same path as RUSTSEC-2025-0075."

[[advisories.ignore]]
id = "RUSTSEC-2025-0081"
reason = "unic-char-property, same path as RUSTSEC-2025-0075."

[[advisories.ignore]]
id = "RUSTSEC-2025-0098"
reason = "unic-ucd-version, same path as RUSTSEC-2025-0075."

[[advisories.ignore]]
id = "RUSTSEC-2025-0100"
reason = "unic-ucd-ident, same path as RUSTSEC-2025-0075."

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  # Mozilla root CA bundle (webpki-root-certs, via reqwest/rustls); data license, permissive.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Uguisu's own crates are AGPL-3.0-or-later and never published; the allow
# list above is about third-party dependencies only (ADR 0048).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# reqwest may only be used through uguisu-http (ADR 0011). Enforced once
# the crate exists; the wrapper list is ready for it.
deny = [
  { crate = "reqwest", wrappers = ["uguisu-http"] },
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
