# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (no vulnerability, no replacement upstream). It
  # is a build-time proc-macro reached only through `lofty`, which Phase 6
  # needs for tag writing. `lofty` 0.25.4 (the latest, checked 2026-10-04)
  # still depends on it, and upstream declined replacing it (lofty-rs PR
  # #625: paste is finished, ignore the advisory), so there is nothing to
  # upgrade to. The macro expands at compile time and ships no runtime code,
  # so the exposure is the build, not the binary. Revisit when `lofty` drops
  # it (docs/SECURITY.md §3.10).
  { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro via lofty; unmaintained, not vulnerable; upstream declined a replacement" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  # Mozilla root CA bundle (webpki-root-certs, via reqwest/rustls); data license, permissive.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Uguisu's own crates are AGPL-3.0-or-later and never published; the allow
# list above is about third-party dependencies only (ADR 0048).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# reqwest may only be used through uguisu-http (ADR 0011). Enforced once
# the crate exists; the wrapper list is ready for it.
deny = [
  { crate = "reqwest", wrappers = ["uguisu-http"] },
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
